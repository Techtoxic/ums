<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/public/img/favicon.png">
    <link rel="shortcut icon" href="/public/favicon.ico">
    <link rel="apple-touch-icon" href="/public/img/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Admin Dashboard - EDTTI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="/public/js/edtti-docs.js"></script>
    
    <!-- Auth Utility (Load First!) -->
    <script src="/public/js/auth.js"></script>
    <script src="/public/js/catalog.js"></script>
    <link rel="stylesheet" href="/public/css/dashboard-styles.css">

    <!-- Frontend Config -->
    <script src="/public/js/config.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7A0C0C',
                        secondary: '#8B2A2A',
                    }
                }
            }
        }
        
        // Test dark mode immediately after Tailwind loads
        console.log('Tailwind darkMode configured as:', tailwind.config.darkMode);
        
        // Verify dark mode support
        window.addEventListener('DOMContentLoaded', () => {
            const testEl = document.createElement('div');
            testEl.className = 'bg-white dark:bg-gray-800';
            document.body.appendChild(testEl);
            const computed = window.getComputedStyle(testEl);
            console.log('Dark mode test element created');
            document.body.removeChild(testEl);
        });
    </script>
    <link rel="stylesheet" href="/public/css/admin-portal.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <!-- Auth gate: covers the dashboard until requireAuth() resolves, suppressing
         the bfcache back-button flash. Skeleton matches admin layout (7 sidebar
         nav items: dashboard/students/trainers/financial/programs/reports/settings;
         4 stat tiles: Students/Trainers/Revenue/Outstanding). -->
    <div id="authGate" class="auth-gate" aria-live="polite" aria-busy="true">
        <aside class="skel-sidebar">
            <div class="skel skel-sidebar__logo"></div>
            <div class="skel skel-sidebar__item"></div>
            <div class="skel skel-sidebar__item"></div>
            <div class="skel skel-sidebar__item"></div>
            <div class="skel skel-sidebar__item"></div>
            <div class="skel skel-sidebar__item"></div>
            <div class="skel skel-sidebar__item"></div>
            <div class="skel skel-sidebar__item"></div>
            <div class="skel skel-sidebar__user"></div>
        </aside>
        <main class="skel-main">
            <div class="skel-topbar">
                <div class="skel skel-topbar__title"></div>
                <div class="skel skel-topbar__action"></div>
            </div>
            <div class="skel skel-welcome"></div>
            <div class="skel-tiles" style="--tile-count: 4;">
                <div class="skel skel-tile"></div>
                <div class="skel skel-tile"></div>
                <div class="skel skel-tile"></div>
                <div class="skel skel-tile"></div>
            </div>
            <div class="skel skel-content"></div>
        </main>
    </div>

    <!-- ── App shell: wide collapsible sidebar + main column ──────────────── -->
    <div id="admin-shell" class="admin-shell">
        <!-- Sidebar -->
        <aside id="sidebar" class="admin-sidebar">
            <div class="admin-sidebar__brand">
                <img src="/public/img/logo.png" alt="EDTTI" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'ri-shield-star-line',style:'font-size:28px;color:var(--maroon)'}))">
                <div class="admin-sidebar__brand-text">EDTTI<small>Admin Portal</small></div>
            </div>

            <nav class="admin-sidebar__nav">
                <div class="admin-sidebar__label">Portal</div>
                <a href="/admin/dashboard" data-section="dashboard" title="Dashboard" class="nav-link active"><i class="ri-dashboard-line"></i><span>Dashboard</span></a>
                <a href="/admin/students"  data-section="students"  title="Students"  class="nav-link"><i class="ri-graduation-cap-line"></i><span>Students</span></a>
                <a href="/admin/trainers"  data-section="trainers"  title="Trainers"  class="nav-link"><i class="ri-user-star-line"></i><span>Trainers</span></a>
                <a href="/admin/financial" data-section="financial" title="Financial" class="nav-link"><i class="ri-money-dollar-circle-line"></i><span>Financial</span></a>
                <a href="/admin/programs"  data-section="programs"  title="Programs"  class="nav-link"><i class="ri-book-2-line"></i><span>Programs</span></a>
                <a href="/admin/reports"   data-section="reports"   title="Reports"   class="nav-link"><i class="ri-bar-chart-box-line"></i><span>Reports</span></a>
                <div class="admin-sidebar__label">System</div>
                <a href="/admin/settings"  data-section="settings"  title="Settings"  class="nav-link"><i class="ri-settings-3-line"></i><span>Settings</span></a>
            </nav>

            <div class="admin-sidebar__footer">
                <div class="admin-sidebar__mini">
                    <div class="admin-sidebar__mini-title">EDTTI Management</div>
                    <a href="#"><i class="ri-question-line"></i> Help</a><a href="#"><i class="ri-book-open-line"></i> Docs</a>
                </div>
                <div class="admin-userchip">
                    <div class="admin-userchip__avatar" id="admin-avatar-initial">A</div>
                    <div class="admin-userchip__meta">
                        <div class="admin-userchip__name" id="admin-name">Admin</div>
                        <div class="admin-userchip__role">Administrator</div>
                    </div>
                </div>
            </div>
            <!-- mobile off-canvas backdrop -->
            <div class="admin-sidebar__backdrop" onclick="toggleSidebar()"></div>
        </aside>

        <!-- Main column -->
        <div class="admin-colmain">
            <header class="admin-topbar">
                <button class="admin-iconbtn lg:hidden" onclick="toggleSidebar()" aria-label="Open menu"><i class="ri-menu-line text-lg"></i></button>
                <button class="admin-iconbtn hidden lg:inline-flex" onclick="toggleSidebar()" aria-label="Collapse sidebar" title="Collapse / expand"><i class="ri-menu-fold-line text-lg"></i></button>
                <div class="admin-topbar__title"><i class="ri-dashboard-line"></i><span>Admin Dashboard</span></div>
                <div class="admin-topbar__spacer"></div>

                <div class="admin-search hidden md:flex">
                    <i class="ri-search-line"></i>
                    <input type="text" id="global-search" placeholder="Search students, trainers…">
                    <kbd>Ctrl K</kbd>
                </div>
                <button id="mobile-search-toggle" class="admin-iconbtn md:hidden" aria-label="Search"><i class="ri-search-line text-lg"></i></button>

                <button class="admin-iconbtn" onclick="toggleDarkMode()" aria-label="Toggle dark mode"><i id="dark-mode-icon" class="ri-moon-line text-lg"></i></button>
                <button class="admin-iconbtn" aria-label="Notifications"><i class="ri-notification-3-line text-lg"></i><span class="dot"></span></button>

                <div class="relative">
                    <button class="admin-avatar" onclick="toggleProfileMenu()" aria-label="Account"><i class="ri-admin-line"></i></button>
                    <div id="profile-menu" class="admin-menu hidden">
                        <a href="#" onclick="event.preventDefault()"><i class="ri-user-line"></i> Profile</a>
                        <button type="button" onclick="showSection('settings'); toggleProfileMenu();"><i class="ri-settings-line"></i> Settings</button>
                        <hr>
                        <button onclick="logout()" class="danger"><i class="ri-logout-box-line"></i> Logout</button>
                    </div>
                </div>
            </header>

            <!-- Mobile Search Modal -->
            <div id="mobile-search-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden md:hidden">
                <div class="p-4" style="background:var(--bg-surface)">
                    <div class="flex items-center gap-2">
                        <input type="text" id="mobile-search-input" placeholder="Search…" class="flex-1 px-3 py-2 text-sm rounded-lg" style="background:var(--bg-muted);border:1px solid var(--border-default);color:var(--text-primary)">
                        <button onclick="closeMobileSearch()" class="admin-iconbtn"><i class="ri-close-line text-xl"></i></button>
                    </div>
                </div>
            </div>

            <!-- Content Area: the router injects each tab's partial here -->
            <main id="tab-root" class="admin-main"></main>
        </div>
    </div>

    <!-- Global elements -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Scripts -->
    <script src="/src/components/admin/portal-core.js"></script>
    <script src="/src/components/admin/portal-router.js"></script>
    <script src="/src/components/admin/tabs/dashboard.js"></script>
    <script src="/src/components/admin/tabs/students.js"></script>
    <script src="/src/components/admin/tabs/trainers.js"></script>
    <script src="/src/components/admin/tabs/financial.js"></script>
    <script src="/src/components/admin/tabs/programs.js"></script>
    <script src="/src/components/admin/tabs/reports.js"></script>
    <script src="/src/components/admin/tabs/settings.js"></script>
</body>
</html>
