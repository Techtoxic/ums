<!-- Header -->
<div class="flex items-center justify-between gap-4 flex-wrap" style="margin-bottom:18px">
    <h1 class="adm-page-title">Students</h1>
    <div class="flex gap-2">
        <button onclick="openAddStudentModal()" class="adm-btn adm-btn--primary"><i class="ri-user-add-line"></i> Add</button>
        <button onclick="exportStudents()" class="adm-btn adm-btn--outline"><i class="ri-file-excel-line"></i> Export</button>
    </div>
</div>

<!-- Filter bar -->
<div class="grid grid-cols-1 sm:grid-cols-12 gap-3" style="margin-bottom:18px">
    <input type="text" id="student-search" placeholder="Search name, admission, course…" class="adm-input sm:col-span-6">
    <select id="module-filter" class="adm-select sm:col-span-3">
        <option value="">All Modules</option>
        <option value="1">M1</option>
        <option value="2">M2</option>
        <option value="3">M3</option>
        <option value="4">M4</option>
        <option value="5">M5</option>
        <option value="6">M6</option>
    </select>
    <select id="program-filter" class="adm-select sm:col-span-3">
        <option value="">All Programs</option>
    </select>
</div>

<!-- Students table (rendered by students.js) -->
<div id="students-table"></div>
