            <div class="card">
                <div class="card__header">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between space-y-4 sm:space-y-0 w-full">
                        <h2 class="text-headline-sm text-gray-900 dark:text-white">My Unit Assignments</h2>
                        <div class="flex items-center space-x-4">
                            <select id="assignmentFilter" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm">
                                <option value="">All Units</option>
                                <option value="current">Current Semester</option>
                                <option value="upcoming">Upcoming Semester</option>
                            </select>
                            <button onclick="refreshAssignments()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors text-sm font-medium">
                                <i class="ri-refresh-line mr-2"></i>Refresh
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card__body">
                    <!-- Loading State -->
                    <div id="loadingState" class="text-center py-12 hidden">
                        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                        <p class="mt-2 text-gray-600 dark:text-gray-400">Loading assignments...</p>
                    </div>

                    <!-- Assignments Grid -->
                    <div id="assignmentsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
                        <!-- Assignment cards will be populated here -->
                    </div>

                    <!-- Empty State -->
                    <div id="emptyState" class="text-center py-12 hidden">
                        <div class="text-gray-400 dark:text-gray-500 text-6xl mb-4">
                            <i class="ri-task-line"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-600 dark:text-gray-400 mb-2">No Assignments Yet</h3>
                        <p class="text-gray-500 dark:text-gray-500">Your HOD will assign units to you when available.</p>
                    </div>

                    <!-- Error State -->
                    <div id="errorState" class="text-center py-12 hidden">
                        <div class="text-red-400 text-6xl mb-4">
                            <i class="ri-error-warning-line"></i>
                        </div>
                        <h3 class="text-lg font-medium text-red-600 dark:text-red-400 mb-2">Error Loading Assignments</h3>
                        <p class="text-red-500 dark:text-red-400 mb-4" id="errorMessage">Something went wrong while loading your assignments.</p>
                        <button onclick="refreshAssignments()" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors text-sm font-medium">
                            <i class="ri-refresh-line mr-2"></i>Try Again
                        </button>
                    </div>
                </div>
            </div>
