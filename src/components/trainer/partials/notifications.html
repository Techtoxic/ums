                <div class="space-y-6">
                    <!-- Notifications Header -->
                    <div class="card">
                        <div class="card__header">
                            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between space-y-4 sm:space-y-0 w-full">
                                <div>
                                    <h2 class="text-headline-sm text-gray-900 dark:text-white">Notifications</h2>
                                    <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">Stay updated with your latest requests and updates</p>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <button onclick="markAllAsRead()" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors text-sm font-medium">
                                        <i class="ri-check-double-line mr-2"></i>Mark All as Read
                                    </button>
                                    <button onclick="refreshNotifications()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors text-sm font-medium">
                                        <i class="ri-refresh-line mr-2"></i>Refresh
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="card__body">
                            <!-- Loading State -->
                            <div id="notificationsLoadingState" class="text-center py-8 hidden">
                                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                                <p class="mt-2 text-gray-600 dark:text-gray-400">Loading notifications...</p>
                            </div>

                            <!-- Notifications List -->
                            <div id="notificationsList" class="space-y-4">
                                <!-- Notifications will be populated here -->
                            </div>

                            <!-- Empty State -->
                            <div id="notificationsEmptyState" class="text-center py-12 hidden">
                                <div class="text-gray-400 dark:text-gray-500 text-6xl mb-4">
                                    <i class="ri-notification-off-line"></i>
                                </div>
                                <h3 class="text-lg font-medium text-gray-600 dark:text-gray-400 mb-2">No Notifications</h3>
                                <p class="text-gray-500 dark:text-gray-500">You're all caught up! No new notifications.</p>
                            </div>
                        </div>
                    </div>
                </div>
