            <div class="card">
                <div class="card__header">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between space-y-4 sm:space-y-0 w-full">
                        <h2 class="text-headline-sm text-gray-900 dark:text-white">My Students</h2>
                        <div class="flex items-center space-x-4">
                            <select id="studentsFilter" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm">
                                <option value="">All Students</option>
                                <option value="module1">Module 1</option>
                                <option value="module2">Module 2</option>
                                <option value="module3">Module 3</option>
                                <option value="module4">Module 4</option>
                                <option value="module5">Module 5</option>
                                <option value="module6">Module 6</option>
                            </select>
                            <button onclick="refreshStudents()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors text-sm font-medium">
                                <i class="ri-refresh-line mr-2"></i>Refresh
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card__body">
                    <!-- Students List -->
                    <div id="studentsGrid" class="flex flex-col divide-y divide-gray-200 dark:divide-gray-700">
                        <!-- Student rows will be populated here -->
                    </div>

                    <!-- Pagination -->
                    <div id="studentsPagination" class="hidden items-center justify-between gap-3 pt-4 mt-3 border-t border-gray-200 dark:border-gray-700 text-sm"></div>

                    <!-- Students Empty State -->
                    <div id="studentsEmptyState" class="text-center py-12 hidden">
                        <div class="text-gray-400 dark:text-gray-500 text-6xl mb-4">
                            <i class="ri-group-line"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-600 dark:text-gray-400 mb-2">No Students Found</h3>
                        <p class="text-gray-500 dark:text-gray-500">Students will appear here when units are assigned.</p>
                    </div>
                </div>
            </div>
