<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dean Portal - Student Welfare Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/dashboard-styles.css">
    <script src="/public/js/dashboard-theme.js"></script>
    <script>
        // Tailwind alias palette realigned to the EDTTI design system so any
        // remaining utility usage (bg-primary, text-primary, focus:ring-purple-*)
        // can be swapped on a per-need basis without re-rendering surprise
        // colors. focus ring purple stays — that's a focus-state-only tint.
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7A0C0C',     // maroon
                        secondary: '#5C0808',   // maroon-dark
                        accent: '#D4A017',      // gold
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        .content-section { display: none; }
        .content-section.active { display: block; }
        /* Purple-gradient .nav-link.active removed — the design-system rule
           in /public/css/dashboard-styles.css gives the active link a maroon
           background and white text, matching the rest of the new chrome. */
    </style>
    <script src="/public/js/auth.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <!-- Top Navigation Bar -->
    <nav class="bg-white dark:bg-gray-800 shadow-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="ri-graduation-cap-line text-3xl text-primary mr-3"></i>
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Dean Portal</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-700 dark:text-gray-300" id="dean-name">Loading...</span>
                    <button data-theme-toggle class="theme-toggle" aria-label="Toggle dark mode">
                        <i class="ri-sun-line theme-icon-light"></i>
                        <i class="ri-moon-line theme-icon-dark"></i>
                    </button>
                    <button id="logoutBtn" class="btn btn--danger btn--icon" aria-label="Logout">
                        <i class="ri-logout-box-line"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="pt-20 flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-white dark:bg-gray-800 shadow-lg h-screen fixed overflow-y-auto">
            <nav class="p-4 space-y-2">
                <a href="#students" class="nav-link flex items-center px-4 py-3 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-purple-50 transition active">
                    <i class="ri-group-line text-xl mr-3"></i>
                    <span>Students</span>
                </a>
                <a href="#notes" class="nav-link flex items-center px-4 py-3 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-purple-50 transition">
                    <i class="ri-file-list-line text-xl mr-3"></i>
                    <span>All Notes</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="ml-64 flex-1 p-8">
            <!-- Students Section -->
            <section id="students" class="content-section active">
                <!-- Header & Filters -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 mb-6">
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-4">Student Management & Welfare</h2>
                    
                    <!-- Search & Filters -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                        <input type="text" id="search-student" placeholder="Search by name, admission number, ID..." 
                            class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        
                        <select id="filter-department" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500">
                            <option value="">All Departments</option>
                        </select>
                        
                        <select id="filter-year" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500">
                            <option value="">All Years</option>
                            <option value="1">Year 1</option>
                            <option value="2">Year 2</option>
                            <option value="3">Year 3</option>
                            <option value="4">Year 4</option>
                        </select>
                        
                        <select id="filter-intake" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500">
                            <option value="">All Intakes</option>
                            <option value="january">January</option>
                            <option value="september">September</option>
                        </select>
                    </div>
                    
                    <button onclick="loadStudents()" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                        <i class="ri-search-line mr-2"></i>Search
                    </button>
                </div>

                <!-- Students Table -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead class="bg-gray-50 dark:bg-gray-900">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Student</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Admission No.</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Course</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Year</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Contact</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-table-body" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                            <tr>
                                <td colspan="6" class="px-6 py-12 text-center text-gray-500 dark:text-gray-400">
                                    <i class="ri-loader-4-line text-4xl animate-spin mb-4"></i>
                                    <p>Loading students...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- All Notes Section -->
            <section id="notes" class="content-section">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">All Student Notes</h2>
                    <div id="all-notes-container">
                        <p class="text-center text-gray-500 dark:text-gray-400 py-8">Select a student to view notes</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add Note Modal -->
    <div id="add-note-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4">
            <div class="p-6 border-b border-gray-200 dark:border-gray-700">
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Add Note</h3>
                    <button onclick="closeAddNoteModal()" class="text-gray-500 dark:text-gray-400 hover:text-gray-700">
                        <i class="ri-close-line text-2xl"></i>
                    </button>
                </div>
                <p class="text-sm text-gray-600 dark:text-gray-400 mt-2">Student: <span id="modal-student-name" class="font-semibold"></span></p>
            </div>
            
            <div class="p-6 space-y-4">
                <!-- Note Type -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Note Type *</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center p-4 border-2 border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:bg-purple-50 transition">
                            <input type="radio" name="noteType" value="private" class="mr-3" checked>
                            <div>
                                <div class="font-semibold text-gray-800 dark:text-gray-100">Private</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">Confidential - Only you can see</div>
                            </div>
                        </label>
                        <label class="flex items-center p-4 border-2 border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:bg-purple-50 transition">
                            <input type="radio" name="noteType" value="public" class="mr-3">
                            <div>
                                <div class="font-semibold text-gray-800 dark:text-gray-100">Public</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">Visible to student</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Category -->
                <div>
                    <label for="note-category" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Category *</label>
                    <select id="note-category" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="welfare">Welfare</option>
                        <option value="academic">Academic</option>
                        <option value="disciplinary">Disciplinary</option>
                        <option value="health">Health</option>
                        <option value="financial">Financial</option>
                        <option value="general">General</option>
                    </select>
                </div>

                <!-- Priority -->
                <div>
                    <label for="note-priority" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Priority *</label>
                    <select id="note-priority" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>

                <!-- Title -->
                <div>
                    <label for="note-title" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Title *</label>
                    <input type="text" id="note-title" placeholder="Enter note title" 
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>

                <!-- Content -->
                <div>
                    <label for="note-content" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Note Content *</label>
                    <textarea id="note-content" rows="6" placeholder="Enter detailed note..." 
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500"></textarea>
                </div>
            </div>

            <div class="p-6 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-3">
                <button onclick="closeAddNoteModal()" class="px-6 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    Cancel
                </button>
                <button onclick="saveNote()" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                    <i class="ri-save-line mr-2"></i>Save Note
                </button>
            </div>
        </div>
    </div>

    <!-- View Student Notes Modal -->
    <div id="view-notes-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto m-4">
            <div class="p-6 border-b border-gray-200 dark:border-gray-700">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-100" id="view-notes-student-name">Student Notes</h3>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mt-1" id="view-notes-student-info"></p>
                    </div>
                    <button onclick="closeViewNotesModal()" class="text-gray-500 dark:text-gray-400 hover:text-gray-700">
                        <i class="ri-close-line text-2xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="p-6">
                <!-- Note Type Filter -->
                <div class="flex space-x-2 mb-6">
                    <button onclick="filterNotes('all')" class="note-filter-btn active px-4 py-2 bg-purple-100 text-purple-700 rounded-lg">
                        All Notes
                    </button>
                    <button onclick="filterNotes('private')" class="note-filter-btn px-4 py-2 bg-gray-100 text-gray-700 dark:text-gray-300 rounded-lg">
                        Private
                    </button>
                    <button onclick="filterNotes('public')" class="note-filter-btn px-4 py-2 bg-gray-100 text-gray-700 dark:text-gray-300 rounded-lg">
                        Public
                    </button>
                </div>

                <div id="student-notes-container"></div>
            </div>
        </div>
    </div>

    <script src="deanDashboard.js"></script>
    <script>
        // Cookie-based auth init + topbar logout wiring. The shared
        // /public/js/auth.js exposes window.AUTH; requireAuth() bounces to
        // /admin/login on no/expired session and populates #dean-name from
        // the /api/me user object so the header shows the real name.
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.AUTH && typeof window.AUTH.requireAuth === 'function') {
                const user = await window.AUTH.requireAuth('/admin/login');
                if (user && user.name) {
                    const nameEl = document.getElementById('dean-name');
                    if (nameEl) nameEl.textContent = user.name;
                }
            }
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn && window.AUTH && typeof window.AUTH.logout === 'function') {
                logoutBtn.addEventListener('click', () => window.AUTH.logout({ role: 'admin' }));
            }
        });
    </script>
</body>
</html>
