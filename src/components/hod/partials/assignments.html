                    <div class="card">
                        <div class="card__body">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-headline-sm text-gray-800 dark:text-gray-200">Current Unit Assignments</h2>
                            <div class="flex space-x-4">
                                <select 
                                    id="assignmentFilter" 
                                    class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200"
                                >
                                    <option value="">All Assignments</option>
                                    <option value="assigned">Assigned Units</option>
                                    <option value="unassigned">Unassigned Units</option>
                                </select>
                                <button
                                    onclick="exportAssignmentsPDF()"
                                    id="exportAssignmentsBtn"
                                    class="bg-primary hover:bg-secondary text-white px-4 py-2 rounded-lg transition-colors duration-200"
                                >
                                    <i class="fas fa-file-pdf mr-2"></i>Export PDF
                                </button>
                                <button
                                    onclick="bulkUnassignUnits()"
                                    id="bulkUnassignBtn"
                                    class="bg-red-600 hover:bg-red-700 dark:bg-red-700 dark:hover:bg-red-800 text-white px-4 py-2 rounded-lg transition-colors duration-200 hidden"
                                >
                                    <i class="fas fa-minus mr-2"></i>Unassign Selected
                                </button>
                            </div>
                        </div>

                        <!-- Assignments Table -->
                        <div class="overflow-x-auto">
                            <table id="assignmentsTable" class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                                <thead class="bg-gray-50 dark:bg-gray-700">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                            <input type="checkbox" id="selectAllAssignments" class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500">
                                        </th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Unit</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Course</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Trainer</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Assigned Date</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Hrs/week</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="assignmentsTableBody" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                                    <!-- Assignment rows will be populated here -->
                                </tbody>
                            </table>
                        </div>
                        </div>
                    </div>
