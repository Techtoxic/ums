                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-800 dark:text-white mb-1">Revenue Management</h2>
                    <p class="text-slate-600 dark:text-slate-300">Record income from sources other than student tuition (farm sales, bus rentals, hall hire, etc.).</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Record form -->
                    <div class="lg:col-span-1">
                        <div class="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-10 h-10 bg-primary/10 rounded-lg flex items-center justify-center">
                                    <i class="ri-add-circle-line text-primary text-xl"></i>
                                </div>
                                <h3 class="text-lg font-semibold text-slate-800 dark:text-white">Record Revenue</h3>
                            </div>
                            <form id="revenue-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Note / Source description</label>
                                    <textarea id="revenue-note" rows="3" required
                                        class="block w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-slate-700 text-slate-900 dark:text-white"
                                        placeholder="e.g. Sale of farm maize harvest, June 2026"></textarea>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Category (optional)</label>
                                    <input type="text" id="revenue-source" list="revenue-source-list"
                                        class="block w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-slate-700 text-slate-900 dark:text-white"
                                        placeholder="e.g. Farm, Transport, Hall Hire">
                                    <datalist id="revenue-source-list">
                                        <option value="Farm Produce"></option>
                                        <option value="Bus / Transport"></option>
                                        <option value="Hall Hire"></option>
                                        <option value="Workshop Services"></option>
                                        <option value="Donations"></option>
                                        <option value="Other"></option>
                                    </datalist>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Amount (KES)</label>
                                    <input type="number" id="revenue-amount" min="1" step="0.01" required
                                        class="block w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-slate-700 text-slate-900 dark:text-white"
                                        placeholder="0.00">
                                </div>
                                <button type="submit"
                                    class="w-full px-4 py-2.5 bg-primary hover:bg-secondary text-white rounded-lg transition-colors flex items-center justify-center gap-2 font-medium">
                                    <i class="ri-save-line"></i> Update
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Analytics + entries -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
                                <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Total Other Revenue</p>
                                <p id="revenue-total" class="text-2xl font-bold text-emerald-600 mt-1">KES 0</p>
                            </div>
                            <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
                                <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Entries Recorded</p>
                                <p id="revenue-count" class="text-2xl font-bold text-slate-900 dark:text-white mt-1">0</p>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
                            <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3">Monthly Revenue Trend</h3>
                            <div class="relative h-48"><canvas id="revenue-chart"></canvas></div>
                        </div>

                        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                            <div class="px-5 py-3 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between gap-2 flex-wrap">
                                <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300">Recorded Revenue</h3>
                                <div class="flex items-center gap-2">
                                    <button type="button" onclick="exportRevenuePDF()"
                                        class="px-3 py-1.5 text-xs font-medium rounded-lg bg-primary hover:bg-secondary text-white transition-colors flex items-center gap-1.5">
                                        <i class="ri-file-pdf-2-line"></i> Export PDF
                                    </button>
                                    <button type="button" onclick="exportRevenueExcel()"
                                        class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors flex items-center gap-1.5">
                                        <i class="ri-file-excel-2-line"></i> Export Excel
                                    </button>
                                </div>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="min-w-full text-sm">
                                    <thead>
                                        <tr class="text-left text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700/40">
                                            <th class="px-4 py-2 font-medium">Date</th>
                                            <th class="px-4 py-2 font-medium">Note</th>
                                            <th class="px-4 py-2 font-medium">Category</th>
                                            <th class="px-4 py-2 font-medium text-right">Amount</th>
                                            <th class="px-4 py-2 font-medium text-right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="revenue-table" class="divide-y divide-slate-100 dark:divide-slate-700/60"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
