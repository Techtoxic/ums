<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deputy Academics Dashboard - University Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/public/css/dashboard-styles.css">
    <!-- Theme controller: in <head>, after styles, runs pre-paint (no flash) -->
    <script src="/public/js/dashboard-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Frontend Config (Load First!) -->
    <script src="/public/js/config.js"></script>
    
    <link rel="stylesheet" href="/public/css/deputy-portal.css">
    <script src="/public/js/auth.js"></script>
    <script src="/public/js/catalog.js"></script>
</head>
<body class="text-slate-800 dark:text-slate-200">
    <div class="dashboard-shell">
        <!-- Sidebar backdrop for mobile -->
        <div class="dashboard-sidebar__backdrop" id="sbBackdrop" onclick="closeSidebar()"></div>

        <!-- Sidebar -->
        <aside class="dashboard-sidebar" id="sidebar">
            <div class="dashboard-sidebar__logo">
                <i class="ri-graduation-cap-line"></i>
                <span>EDTTI</span>
            </div>
            <nav class="dashboard-sidebar__nav">
                <a href="/deputy/dashboard" id="nav-dashboard" class="nav-link active">
                    <i class="ri-dashboard-line"></i><span>Dashboard</span>
                </a>
                <a href="/deputy/students" id="nav-students" class="nav-link">
                    <i class="ri-team-line"></i><span>Students</span>
                </a>
                <a href="/deputy/trainers" id="nav-trainers" class="nav-link">
                    <i class="ri-user-star-line"></i><span>Trainers</span>
                </a>
                <a href="/deputy/courses" id="nav-courses" class="nav-link">
                    <i class="ri-book-open-line"></i><span>Courses</span>
                </a>
                <a href="/deputy/units" id="nav-units" class="nav-link">
                    <i class="ri-file-list-3-line"></i><span>Units</span>
                </a>
                <a href="/deputy/tools" id="nav-tools" class="nav-link">
                    <i class="ri-tools-line"></i><span>Tools of Trade</span>
                </a>
                <a href="/deputy/notifications" id="nav-notifications" class="nav-link">
                    <i class="ri-notification-3-line"></i><span>Notifications</span>
                </a>
            </nav>
            <div class="dashboard-sidebar__profile">
                <div class="dashboard-sidebar__avatar" id="userAvatar">D</div>
                <div class="dashboard-sidebar__profile-text">
                    <div class="font-semibold text-body-sm" id="userName">Deputy</div>
                    <div class="text-body-sm" style="color:var(--text-muted)">Deputy Academics</div>
                </div>
            </div>
        </aside>

        <!-- Main column: topbar + content -->
        <div>
            <!-- Topbar -->
            <header class="dashboard-topbar">
                <button class="btn btn--ghost btn--icon lg:hidden" onclick="openSidebar()" aria-label="Open menu">
                    <i class="ri-menu-line"></i>
                </button>
                <div class="dashboard-topbar__title">Deputy Academics Dashboard</div>
                <div class="dashboard-topbar__actions">
                    <button data-theme-toggle class="theme-toggle" aria-label="Toggle dark mode">
                        <i class="ri-sun-line theme-icon-light"></i>
                        <i class="ri-moon-line theme-icon-dark"></i>
                    </button>
                    <button id="logoutBtn" class="btn btn--danger btn--icon" aria-label="Logout">
                        <i class="ri-logout-box-line"></i>
                    </button>
                </div>
            </header>

            <!-- Main Content -->
            <main class="dashboard-main">
        <!-- Page Header -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold" id="pageTitle">Dashboard Overview</h1>
                <p class="text-slate-500 dark:text-slate-400">Welcome back, <span id="welcomeName">Deputy</span>!</p>
            </div>
        </div>

                <!-- Content area: the router injects each tab's partial here -->
                <div id="tab-root"></div>
            </main>
        </div>
    </div><!-- /.dashboard-shell -->

    <!-- Scripts -->
    <script src="/src/components/deputy/portal-core.js"></script>
    <script src="/src/components/deputy/portal-router.js"></script>
    <script src="/src/components/deputy/tabs/dashboard.js"></script>
    <script src="/src/components/deputy/tabs/students.js"></script>
    <script src="/src/components/deputy/tabs/trainers.js"></script>
    <script src="/src/components/deputy/tabs/courses.js"></script>
    <script src="/src/components/deputy/tabs/units.js"></script>
    <script src="/src/components/deputy/tabs/tools.js"></script>
    <script src="/src/components/deputy/tabs/notifications.js"></script>
</body>
</html>
