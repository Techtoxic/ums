<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/public/img/favicon.png">
    <link rel="shortcut icon" href="/public/favicon.ico">
    <link rel="apple-touch-icon" href="/public/img/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Deputy Principal Dashboard - EDTTI</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/public/css/dashboard-styles.css">
    <!-- Theme controller: in <head>, after styles, runs pre-paint (no flash) -->
    <script src="/public/js/dashboard-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Frontend Config (Load First!) -->
    <script src="/public/js/config.js"></script>

    <link rel="stylesheet" href="/public/css/deputy-portal.css">
    <script src="/public/js/auth.js"></script>
    <script src="/public/js/catalog.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#7A0C0C', secondary: '#8B2A2A' } } }
        }
    </script>
    <!-- Reuse the admin component CSS (shared shadcn-style primitives) -->
    <link rel="stylesheet" href="/public/css/admin-portal.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200 text-slate-800 dark:text-slate-200">

    <!-- ── App shell: wide collapsible sidebar + main column ──────────────── -->
    <div id="deputy-shell" class="admin-shell">
        <!-- Sidebar -->
        <aside id="sidebar" class="admin-sidebar">
            <div class="admin-sidebar__brand">
                <img src="/public/img/logo.png" alt="EDTTI" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'ri-shield-star-line',style:'font-size:28px;color:var(--maroon)'}))">
                <div class="admin-sidebar__brand-text">EDTTI<small>Deputy Principal</small></div>
            </div>

            <nav class="admin-sidebar__nav">
                <div class="admin-sidebar__label">Portal</div>
                <a href="/deputy/dashboard" id="nav-dashboard" data-section="dashboard" title="Dashboard" class="nav-link active"><i class="ri-dashboard-line"></i><span>Dashboard</span></a>
                <a href="/deputy/students"  id="nav-students"  data-section="students"  title="Students"  class="nav-link"><i class="ri-graduation-cap-line"></i><span>Students</span></a>
                <a href="/deputy/trainers"  id="nav-trainers"  data-section="trainers"  title="Trainers"  class="nav-link"><i class="ri-user-star-line"></i><span>Trainers</span></a>
                <a href="/deputy/courses"   id="nav-courses"   data-section="courses"   title="Courses"   class="nav-link"><i class="ri-book-2-line"></i><span>Courses</span></a>
                <a href="/deputy/units"     id="nav-units"     data-section="units"     title="Units"     class="nav-link"><i class="ri-file-list-3-line"></i><span>Units</span></a>
                <a href="/deputy/tools"     id="nav-tools"     data-section="tools"     title="Tools of Trade" class="nav-link"><i class="ri-tools-line"></i><span>Tools of Trade</span></a>
                <div class="admin-sidebar__label">System</div>
                <a href="/deputy/notifications" id="nav-notifications" data-section="notifications" title="Notifications" class="nav-link"><i class="ri-notification-3-line"></i><span>Notifications</span></a>
            </nav>

            <div class="admin-sidebar__footer">
                <div class="admin-sidebar__mini">
                    <div class="admin-sidebar__mini-title">EDTTI Management</div>
                    <a href="#"><i class="ri-question-line"></i> Help</a><a href="#"><i class="ri-book-open-line"></i> Docs</a>
                </div>
                <div class="admin-userchip">
                    <div class="admin-userchip__avatar" id="userAvatar">D</div>
                    <div class="admin-userchip__meta">
                        <div class="admin-userchip__name" id="userName">Deputy</div>
                        <div class="admin-userchip__role">Deputy Principal</div>
                    </div>
                </div>
            </div>
            <!-- mobile off-canvas backdrop -->
            <div class="admin-sidebar__backdrop" id="sbBackdrop" onclick="toggleSidebar()"></div>
        </aside>

        <!-- Main column -->
        <div class="admin-colmain">
            <header class="admin-topbar">
                <button class="admin-iconbtn lg:hidden" onclick="toggleSidebar()" aria-label="Open menu"><i class="ri-menu-line text-lg"></i></button>
                <button class="admin-iconbtn hidden lg:inline-flex" onclick="toggleSidebar()" aria-label="Collapse sidebar" title="Collapse / expand"><i class="ri-menu-fold-line text-lg"></i></button>
                <div class="admin-topbar__title"><i class="ri-dashboard-line"></i><span id="pageTitle">Dashboard Overview</span></div>
                <span id="academic-year-chip" class="pill pill--neutral hidden" style="margin-left:2px" title="Current academic year"></span>
                <div class="admin-topbar__spacer"></div>

                <button class="admin-iconbtn" data-theme-toggle onclick="toggleDarkMode()" aria-label="Toggle dark mode"><i id="dark-mode-icon" class="ri-moon-line text-lg"></i></button>
                <button class="admin-iconbtn" onclick="showSection('notifications')" aria-label="Notifications"><i class="ri-notification-3-line text-lg"></i><span class="dot"></span></button>

                <div class="relative">
                    <button class="admin-avatar" onclick="toggleProfileMenu()" aria-label="Account"><i class="ri-user-line"></i></button>
                    <div id="profile-menu" class="admin-menu hidden">
                        <a href="#" onclick="event.preventDefault()"><i class="ri-user-line"></i> Profile</a>
                        <button type="button" onclick="showSection('notifications'); toggleProfileMenu();"><i class="ri-notification-3-line"></i> Notifications</button>
                        <hr>
                        <button id="logoutBtn" onclick="logout()" class="danger"><i class="ri-logout-box-line"></i> Logout</button>
                    </div>
                </div>
            </header>

            <!-- Content Area: the router injects each tab's partial here -->
            <main id="tab-root" class="admin-main"></main>
        </div>
    </div>

    <!-- Global elements -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Scripts -->
    <script src="/src/components/deputy/portal-core.js"></script>
    <script src="/src/components/deputy/portal-router.js"></script>
    <script src="/src/components/deputy/tabs/dashboard.js"></script>
    <script src="/src/components/deputy/tabs/students.js"></script>
    <script src="/src/components/deputy/tabs/trainers.js"></script>
    <script src="/src/components/deputy/tabs/courses.js"></script>
    <script src="/src/components/deputy/tabs/units.js"></script>
    <script src="/src/components/deputy/tabs/tools.js"></script>
    <script src="/src/components/deputy/tabs/notifications.js"></script>
</body>
</html>
