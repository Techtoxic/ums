<!-- Header -->
<div class="flex items-center justify-between gap-4 flex-wrap" style="margin-bottom:18px">
    <h1 class="adm-page-title"><i class="ri-user-star-line"></i> Trainers</h1>
</div>

<!-- Filter bar -->
<div class="grid grid-cols-1 sm:grid-cols-12 gap-3" style="margin-bottom:18px">
    <input id="deputyTrainersSearch" type="text" placeholder="Search name or email…" class="adm-input sm:col-span-7">
    <select id="deputyTrainersDepartment" class="adm-select sm:col-span-5">
        <option value="all">All Departments</option>
        <option value="applied_science">Applied Science</option>
        <option value="agriculture">Agriculture</option>
        <option value="building_civil">Building &amp; Civil</option>
        <option value="electromechanical">Electromechanical</option>
        <option value="hospitality">Hospitality</option>
        <option value="business_liberal">Business &amp; Liberal</option>
        <option value="computing_informatics">Computing &amp; Informatics</option>
    </select>
</div>

<!-- Trainers table -->
<div class="adm-card">
    <div class="adm-card__head">
        <div class="adm-card__title"><i class="ri-user-star-line"></i> Trainer List</div>
    </div>
    <div class="adm-table-wrap">
        <table class="adm-table">
            <thead>
                <tr>
                    <th>Trainer</th>
                    <th>Department</th>
                    <th>Units Assigned</th>
                    <th>Students Enrolled</th>
                    <th style="text-align:right">Status</th>
                </tr>
            </thead>
            <tbody id="trainersTableBody">
                <!-- Trainers will be loaded here -->
            </tbody>
        </table>
    </div>
    <div id="trainersPagination" class="adm-card__body"></div>
</div>
