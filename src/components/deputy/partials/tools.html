<!-- Header -->
<div class="flex items-center justify-between gap-4 flex-wrap" style="margin-bottom:18px">
    <h1 class="adm-page-title"><i class="ri-tools-line"></i> Tools of Trade</h1>
    <button class="adm-btn adm-btn--primary" onclick="openToolRequestModal()">
        <i class="ri-add-line"></i> Request Tools of Trade
    </button>
</div>

<!-- Tools of Trade Request Modal -->
<div id="toolRequestModal" class="adm-modal-overlay hidden items-center justify-center">
    <div class="adm-modal" style="max-width:560px">
        <div class="adm-modal__head">
            <div class="adm-modal__title"><i class="ri-tools-line"></i> Request Tools of Trade</div>
            <button onclick="closeToolRequestModal()" class="admin-iconbtn" aria-label="Close"><i class="ri-close-line text-xl"></i></button>
        </div>
        <div class="adm-modal__body">
            <form id="toolRequestForm" onsubmit="handleToolRequest(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="adm-label">Tool Type</label>
                    <select name="toolType" required class="adm-select">
                        <option value="">Select Tool Type</option>
                        <option value="course_outline">Course Outline</option>
                        <option value="learning_plan">Learning Plan</option>
                        <option value="record_of_work">Record of Work</option>
                        <option value="session_plan">Session Plan</option>
                        <option value="exam">Exam</option>
                        <option value="tvet_license">TVET License</option>
                    </select>
                </div>
                <div>
                    <label class="adm-label">Send To</label>
                    <select name="sendTo" id="sendToSelect" required class="adm-select" onchange="handleSendToChange()">
                        <option value="all_trainers">All Trainers</option>
                        <option value="by_department">By Department</option>
                        <option value="specific_trainer">Specific Trainer</option>
                    </select>
                </div>
                <div id="departmentFilter" class="hidden">
                    <label class="adm-label">Department</label>
                    <select name="department" id="departmentSelect" class="adm-select" onchange="loadTrainersByDepartment()">
                        <option value="">Select Department</option>
                        <!-- Department options populated from the shared catalog in tools tab init() -->
                    </select>
                </div>
                <div id="trainerFilter" class="hidden">
                    <label class="adm-label">Trainer</label>
                    <select name="trainer" id="trainerSelect" class="adm-select">
                        <option value="">Select Trainer</option>
                    </select>
                </div>
                <div>
                    <label class="adm-label">Due Date</label>
                    <input type="date" name="dueDate" required class="adm-input">
                </div>
                <div class="sm:col-span-2">
                    <label class="adm-label">Special Instructions</label>
                    <textarea name="instructions" rows="3" class="adm-textarea" placeholder="Enter any specific requirements or notes..."></textarea>
                </div>
                <div class="sm:col-span-2 flex justify-end gap-3 mt-2">
                    <button type="button" onclick="closeToolRequestModal()" class="adm-btn adm-btn--ghost">Cancel</button>
                    <button type="submit" class="adm-btn adm-btn--primary">Submit Request</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Filters -->
<div class="adm-card" style="margin-bottom:16px"><div class="adm-card__body" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
    <div>
        <label class="adm-label">Tool Type</label>
        <select id="toolsFilterType" class="adm-select">
            <option value="">All Types</option>
            <option value="course_outline">Course Outline</option>
            <option value="learning_plan">Learning Plan</option>
            <option value="record_of_work">Record of Work</option>
            <option value="session_plan">Session Plan</option>
            <option value="exam">Exam</option>
            <option value="tvet_license">TVET License</option>
        </select>
    </div>
    <div>
        <label class="adm-label">Department</label>
        <select id="toolsFilterDept" class="adm-select"><option value="">All Departments</option></select>
    </div>
    <div>
        <label class="adm-label">Status</label>
        <select id="toolsFilterStatus" class="adm-select">
            <option value="">All Statuses</option>
            <option value="submitted">Submitted</option>
            <option value="reviewed">Reviewed</option>
            <option value="rejected">Rejected</option>
        </select>
    </div>
    <div style="flex:1"></div>
    <button id="toolsClearFilters" class="adm-btn adm-btn--ghost adm-btn--sm"><i class="ri-filter-off-line"></i> Clear</button>
</div></div>

<!-- Tools List — JS (tabs/tools.js displayToolsOfTrade) renders a paginated table here. -->
<div id="toolsContainer"></div>
<!-- Pagination (hidden for a single page) -->
<div id="toolsPagination" class="hidden" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;margin-top:8px;border-top:1px solid var(--border,#e5e7eb);font-size:13px"></div>
