<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDTTI Student Portal — Transcript</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Frontend Config (Load First!) -->
    <script src="/public/js/config.js"></script>

    <!-- Global fetch interceptor: ensure the httpOnly auth cookie attaches to
         every /api/ call. Bearer-token injection remains as a fallback for any
         legacy sessionStorage token still in the wild — but post-migration this
         will be a no-op and the cookie carries identity. -->
    <script>
        (function() {
            const _origFetch = window.fetch;
            window.fetch = function(url, options) {
                options = options || {};
                if (typeof url === 'string' && url.includes('/api/')) {
                    options.credentials = options.credentials || 'include';
                    const token = sessionStorage.getItem('studentToken')
                               || localStorage.getItem('studentToken');
                    if (token) {
                        options.headers = Object.assign({}, options.headers, {
                            'Authorization': 'Bearer ' + token
                        });
                    }
                }
                return _origFetch(url, options);
            };
        })();
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7A0C0C',
                        secondary: '#8B2A2A',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        gray: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'bounce-gentle': 'bounceGentle 2s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' }
                        },
                        bounceGentle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' }
                        }
                    }
                }
            },
            darkMode: 'class'
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #7A0C0C 0%, #8B2A2A 100%);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
.js
        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .progress-ring {
            transition: stroke-dasharray 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .sidebar-collapsed {
            width: 4rem !important;
        }

        .sidebar-collapsed .sidebar-text {
            display: none !important;
        }

        .sidebar-collapsed .sidebar-title {
            display: none !important;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }
        }
    </style>
    <link rel="stylesheet" href="/public/css/dashboard-styles.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans">
    <!-- studentLayout.js injects the shared sidebar + header here, then exposes
         #page-content. The inline script below copies this page's section markup
         (the <template>) into it once the shell is in place. -->
    <div id="layout-root"></div>

    <!-- Page-specific content (verbatim from the monolith's transcript section,
         with the `hidden` class removed since this is now its own page). -->
    <template id="page-tpl">
        <!-- Transcript Section -->
        <section id="transcript" class="content-section">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                <div class="p-6 border-b border-gray-200 dark:border-gray-700">
                    <h2 class="text-base md:text-sm md:text-base font-semibold text-gray-800 dark:text-white">Academic Transcript</h2>
                    <p class="text-gray-600 dark:text-gray-400 mt-1">Your academic records and achievements</p>
                </div>
                <div class="p-6">
                    <div class="text-center py-8">
                        <div class="w-16 h-16 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="ri-file-text-line text-2xl text-gray-400"></i>
                        </div>
                        <p class="text-gray-600 dark:text-gray-400">Transcript will be available after course completion</p>
                    </div>
                </div>
            </div>
        </section>
    </template>

    <!-- Absolute paths (served by the /src/components static mount): this page
         lives at the deeper URL /student/portal/transcript, so relative script
         srcs would resolve to /student/portal/*.js and 404. config.js is already
         loaded in the head — do not re-load it here. -->
    <script src="/public/js/auth.js"></script>
    <script src="/src/components/student/studentCommon.js"></script>
    <script src="/src/components/student/studentLayout.js"></script>
    <script>
        // studentLayout.js has already injected #page-content (it runs
        // synchronously). Drop this page's section markup into it.
        document.getElementById('page-content').innerHTML = document.getElementById('page-tpl').innerHTML;
    </script>
</body>
</html>
