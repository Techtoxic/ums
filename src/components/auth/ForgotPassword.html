<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/public/img/favicon.png">
    <link rel="shortcut icon" href="/public/favicon.ico">
    <link rel="apple-touch-icon" href="/public/img/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EDTTI University Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/auth-styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7A0C0C',
                        secondary: '#8B2A2A',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="auth-page">
    <div class="relative w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
            <!-- EDTTI Brand -->
            <div class="auth-brand">
                <i class="ri-graduation-cap-line"></i>
                <span>EDTTI</span>
            </div>
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="mx-auto w-16 h-16 bg-gradient-to-r from-primary to-secondary rounded-full flex items-center justify-center mb-4">
                    <i class="ri-mail-send-line text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-2">Forgot Password?</h1>
                <p class="text-gray-600" id="subtitle">Enter your email to receive a password reset link</p>
            </div>

            <!-- Request Form -->
            <form id="forgotForm" class="space-y-6">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="ri-mail-line mr-2 text-primary"></i>Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your registered email"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
                        required
                    >
                </div>

                <!-- User Type (Hidden, auto-set from URL) -->
                <input type="hidden" id="userType" value="admin">

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full bg-gradient-to-r from-primary to-secondary text-white py-3 px-6 rounded-xl font-medium hover:from-secondary hover:to-primary focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <i class="ri-send-plane-line mr-2"></i>
                    <span id="submitBtnText">Send Reset Link</span>
                </button>
            </form>

            <!-- Success Message -->
            <div id="successMessage" class="hidden text-center py-4">
                <div class="mx-auto w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4">
                    <i class="ri-check-line text-green-600 text-2xl"></i>
                </div>
                <h2 class="text-xl font-semibold text-gray-800 mb-2">Check Your Email!</h2>
                <p class="text-gray-600 mb-4">If an account exists with that email, you will receive a password reset link shortly.</p>
            </div>

            <!-- Back to Login -->
            <div class="mt-8 text-center">
                <a href="/admin/login" class="text-primary hover:text-secondary transition-colors text-sm">
                    <i class="ri-arrow-left-line mr-1"></i>Back to Login
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-gray-600 text-sm">
            <p>&copy; 2025 EDTTI University Management System. All rights reserved.</p>
        </div>
    </div>

    <script>
        // Get user type from URL
        const urlParams = new URLSearchParams(window.location.search);
        const userType = urlParams.get('type') || 'admin';
        document.getElementById('userType').value = userType;

        // Handle form submission
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');
            
            // Disable button
            submitBtn.disabled = true;
            submitBtnText.textContent = 'Sending...';
            
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        userType: userType,
                        resetMethod: 'token'
                    })
                });
                
                const data = await response.json();
                
                // Show success regardless (security - don't reveal if email exists)
                document.getElementById('forgotForm').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
                
            } catch (error) {
                console.error('Error:', error);
                // Still show success for security
                document.getElementById('forgotForm').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
